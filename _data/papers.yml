- title: Non-Markovian dissipation as a resource for quantum reservoir computing
  authors: L. Nigro, F. Monzani, E. Prati
  venue: arXiv:2609.40172
  year: 2026
  links:
    arxiv: "https://arxiv.org/abs/2609.40172"
  abstract: >-
    Non-Markovianity modelled and regulated with fractional derivatives: time
    subordination gives tunable, heavy-tailed relaxation whose information
    backflow redistributes reservoir memory towards recent inputs, improving
    short-delay memory capacity and nonlinear prediction.
  bibtex: |
    @article{nigro2026nonmarkovian,
      title   = {Non-Markovian dissipation as a resource for quantum reservoir computing},
      author  = {Nigro, Luca and Monzani, Francesco and Prati, Enrico},
      journal = {arXiv preprint arXiv:2609.40172},
      year    = {2026}
    }

- title: Analog neutral-atom for in-memory processing in quantum reservoir computing
  authors: L. Nigro, G. L. Giorgi, E. Prati, R. Zambrini
  venue: arXiv:2609.28441
  year: 2026
  links:
    arxiv: "https://arxiv.org/abs/2609.28441"
  abstract: >-
    Controlled dissipation is strictly necessary to give neutral-atom reservoirs
    the echo state property, fading memory and separability. Performance peaks at
    the edge of quantum chaos, and as few as five atoms solve the Mackey-Glass
    time series without external classical buffering.
  bibtex: |
    @article{nigro2026analog,
      title   = {Analog neutral-atom for in-memory processing in quantum reservoir computing},
      author  = {Nigro, Luca and Giorgi, Gian Luca and Prati, Enrico and Zambrini, Roberta},
      journal = {arXiv preprint arXiv:2609.28441},
      year    = {2026}
    }

- title: Quantum reservoir computing induced by controllable damping
  authors: E. Ricci, F. Monzani, L. Nigro, E. Prati
  venue: npj Quantum Information
  year: 2026
  links:
    doi: "https://doi.org/10.1038/s41534-026-01229-8"
    arxiv: "https://arxiv.org/abs/2508.14621"
  abstract: >-
    Controlled rotations induce tunable damping in quantum circuits, giving
    stable, non-unital reservoir dynamics for temporal information processing
    without relying on intrinsic hardware noise.
  bibtex: |
    @article{ricci2026damping,
      title   = {Quantum reservoir computing induced by controllable damping},
      author  = {Ricci, Emanuele and Monzani, Francesco and Nigro, Luca and Prati, Enrico},
      journal = {npj Quantum Information},
      year    = {2026},
      doi     = {10.1038/s41534-026-01229-8}
    }

