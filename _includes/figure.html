{%- comment -%}
  One photo with an optional caption.
  {% include figure.html src="/assets/img/…/photo.jpg" caption="Words." size="wide" %}
  size: (empty) = text width · "wide" = breaks out of the text column · "full" = edge to edge
{%- endcomment -%}
<figure class="figure {{ include.size }}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | strip_html }}" loading="lazy">{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}</figure>
