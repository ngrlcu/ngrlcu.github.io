<!doctype html>
{%- assign width = page.width | default: layout.width | default: "narrow" -%}
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/inter-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/newsreader-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    (function () {
      function sbw() { document.documentElement.style.setProperty("--sbw", (window.innerWidth - document.documentElement.clientWidth) + "px"); }
      document.addEventListener("DOMContentLoaded", sbw); window.addEventListener("resize", sbw);
    })();
  </script>
</head>
<body>
  {% include header.html width=width %}
  <main class="shell {{ width }}">
    {{ content }}
  </main>
  {% include footer.html width=width %}
</body>
</html>
