- title: Non-unital noise in a superconducting quantum computer as a computational resource for reservoir computing
  authors: F. Monzani, E. Ricci, L. Nigro, E. Prati
  venue: arXiv:2409.07886
  year: 2025
  links:
    arxiv: "https://arxiv.org/abs/2409.07886"
  abstract: >-
    Amplitude-damping noise, modelled as a non-unital channel, improves reservoir
    computing on time-dependent tasks by preventing the information loss caused
    by mid-circuit measurements.
